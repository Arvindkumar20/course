<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="./assets/css/mainstyle.css">
</head>

<body>
    <div class="form-container">
        <form class="login-form">
            <h1 class="login-heading">Welcome back in DOM in JS Class</h1>
            <input type="text" name="name" id="name" class="name" placeholder="Enter your name" minlength="3"
                maxlength="50">
            <span class="error" id="nameError"></span>
            <input type="email" name="email" id="email" class="email" placeholder="Enter your email" minlength="8"
                maxlength="100" required>
            <span class="error" id="emailError"></span>


            <input type="password" name="password" id="password" class="password" placeholder="Enter your password"
                minlength="6" maxlength="20" required>
            <div id="passwordError" style="color: red;"></div>
            <div id="passwordStrength"></div>



            <button type="submit" id="btn">Submit</button>
        </form>
    </div>

    <script src="./assets/js/login.js"></script>
</body>

</html>
