<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User List</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
</head>
<body>
    <section id="product-popup"
        class="fixed container mx-auto my-10 w-full sm:w-5/6 md:w-2/3 lg:w-1/2 flex items-center justify-center left-72 top-28">
    </section>

    <ul id="user-list"
        class="container  mx-auto grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 space-y-5 space-x-6 ">
    </ul>

    <p id="error" class="text-red-600"></p>
    <script>

        let error = document.getElementById("error");
        let userList = document.getElementById("user-list");
        let openPopWithProduct = document.getElementById("product-popup");

        async function loadData() {
            try {
                let res = await fetch("https://fakestoreapi.com/products");
                let products = await res.json();
                console.log(products);
                products?.map((product, index) => {
                    let li = document.createElement("li");
                    li.key = index + 1;
                    li.innerHTML = `<div class="p-5 shadow-xl bg-white border rounded-md w-full h-full grid space-y-2 " onmouseenter="openProductCard(${product.id})">
                        <img src="${product?.image}" class="w-full object-contain h-[250px] border-b-1 pb-5">
                         <h3 class="text-lg font-bold">${product?.title}</h3>
                         <p>${product.description.slice(0, 100)}...</p>
                         <p> <span class="text-md font-semibold">Category : </span>${product.category}</p>
                         <p><span class="text-md font-semibold">Price : </span> ${product.price} $</p>
                       <div style="display:flex;"> 
                    <span class="text-md font-semibold">Rating : </span>
                         <p> ${product.rating.count}</p>
                         <p>," " ${product.rating.rate}</p>
                         </div>
                         
                        </div>
            `
                    userList.appendChild(li);
                });

            } catch (error) {
                console.log(error);
                error.textContent = error.message;
            }
        }

        loadData();

        async function openProductCard(id) {
            let counter = 0
            if (counter > 1) {
                return;
            }
            openPopWithProduct.innerHTML = ""


            let res = await fetch("https://fakestoreapi.com/products");
            let products = await res.json();

            let product = products.filter(p => p.id == id)[0];//[{ name: "dgs", price: 54354, image }]

            let div = document.createElement("div");
            1;
            div.innerHTML = `<div class="relative p-5 shadow-xl bg-white  rounded-md w-full h-full grid  space-y-2  " id="${id}">
                        <img src="${product?.image}" class="w-full object-contain h-[250px]">
                        <div class="p-5">
                            
                             <h3 class="text-lg font-bold">${product?.title}</h3>
                         <p>${product.description}</p>
                         <p> <span class="text-md font-semibold">Category : </span>${product.category}</p>
                         <p><span class="text-md font-semibold">Price : </span> ${product.price} $</p>
                       <div style="display:flex;"> 
                    <span class="text-md font-semibold">Rating : </span>
                         <p> ${product.rating.count}</p>
                         <p>," " ${product.rating.rate}</p>
                         </div>
                            </div>
                        </div>
            `


            openPopWithProduct.appendChild(div);

            counter++;
        }



    </script>
</body>

</html>
