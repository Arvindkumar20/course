<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body>

    <div class=" container mx-auto my-10">
        <h1 class="text-2xl text-center font-bold ">Welcome to Location Page</h1>
        <div class="flex items-center justify-center my-10">
            <div class="text-md ">
                <p>Your Current location is</p>
                <address id="address" class="text-green-600 font-bold my-2">Lucknow</address>
                <p id="success" class="mb-1 text-green-500 text-sm"></p>
                <button type="button" id="copy-address"
                    class="py-2 px-3 border-1 bg-blue-500 text-white cursor-pointer rounded-md">copy
                    Address</button>
                <a  id="open-address"
                    class="py-2 px-3 border-1 bg-blue-500 text-white cursor-pointer rounded-md">Open with Map</a>
            </div>
        </div>

    </div>

    <script src="index.js"></script>
</body>

</html>
